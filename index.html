<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glow Bounce</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            touch-action: none;
            animation:flashBg 0.12s infinite alternate;
        }
        .neon-text {
            position: absolute;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            white-space: nowrap;
            user-select: none;
            will-change: transform;
            animation: rainbowFlow 3s ease infinite;
        }
        #box1 {
            background: linear-gradient(90deg, #ff007f, #ff7b00, #ffee00, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 0, 128, 0.8)) drop-shadow(0 0 35px rgba(255, 120, 0, 0.6));
        }
        #box2 {
            background: linear-gradient(90deg, #00f0ff, #00ff66, #b000ff, #00f0ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.8)) drop-shadow(0 0 35px rgba(176, 0, 255, 0.6));
        }
        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes flashBg {
    0%   { background-color: #000000; }
    25%  { background-color: #2b0036; }
    50%  { background-color: #ffffff; }
    75%  { background-color: #001a33; }
    100% { background-color: #ff0055; }
}

    </style>
</head>
<body>
    <div id="box1" class="neon-text">Fuck you</div>
    <div id="box2" class="neon-text">THX天下牛逼</div>

    <script>
        const b1 = { el: document.getElementById("box1"), x: 20, y: 30, vx: 2.2, vy: 2.6, w: 0, h: 0 };
        const b2 = { el: document.getElementById("box2"), x: 200, y: 300, vx: -2.5, vy: -2.0, w: 0, h: 0 };

        function updateBounds() {
            b1.w = b1.el.offsetWidth;
            b1.h = b1.el.offsetHeight;
            b2.w = b2.el.offsetWidth;
            b2.h = b2.el.offsetHeight;
        }

        function checkCollision() {
            if (b1.x < b2.x + b2.w && b1.x + b1.w > b2.x &&
                b1.y < b2.y + b2.h && b1.y + b1.h > b2.y) {
                // 碰撞後速度互換並增加微小隨機量，實現自然彈開
                let tempVx = b1.vx;
                let tempVy = b1.vy;
                b1.vx = b2.vx + (Math.random() - 0.5);
                b1.vy = b2.vy + (Math.random() - 0.5);
                b2.vx = tempVx + (Math.random() - 0.5);
                b2.vy = tempVy + (Math.random() - 0.5);

                // 微調位置防止黏住
                b1.x += b1.vx * 2;
                b1.y += b1.vy * 2;
                b2.x += b2.vx * 2;
                b2.y += b2.vy * 2;
            }
        }

        function move(b) {
            const W = window.innerWidth;
            const H = window.innerHeight;
            b.x += b.vx;
            b.y += b.vy;

            if (b.x + b.w >= W) { b.x = W - b.w; b.vx = -(Math.random() * 1.5 + 1.8); }
            else if (b.x <= 0) { b.x = 0; b.vx = Math.random() * 1.5 + 1.8; }

            if (b.y + b.h >= H) { b.y = H - b.h; b.vy = -(Math.random() * 1.5 + 1.8); }
            else if (b.y <= 0) { b.y = 0; b.vy = Math.random() * 1.5 + 1.8; }

            b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
        }

        function animate() {
            move(b1);
            move(b2);
            checkCollision();
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            updateBounds();
            animate();
        };
        window.onresize = updateBounds;
    </script>
</body>
</html>
